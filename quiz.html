<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Interaktif — Teknik Informatika Unmuh Jember</title>
  <meta name="description" content="Uji wawasan logika dan pengetahuan dasar seputar teknologi informasi melalui kuis interaktif Teknik Informatika Unmuh Jember.">
  <link rel="icon" type="image/png" href="assets/img/teknik.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsif.css">
    <script src="assets/js/quiz.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelector("body").addEventListener("load", NextQuestion(0));
      });
</script>
</head>

<body >
  <!-- backbutton  -->
<a href="bahasa.html">
  <div class="back-button-container">
    <i class="fas fa-arrow-left"></i>
  </div>
</a>
  <main class="mainmain">
    <div class="score-modal-container" id="score-modal">
      <div class="score-content-container">
        <h1>Selamat, Quiz Selesai !</h1>

        <div class="grade-detail">
          <p>Soal : 10</p>
          <p>Jawaban Benar : <span id="right-answers"></span></p>
          <p>Jawaban Salah : <span id="wrong-answers"></span></p>
          <p>Nilai : <span id="grade-percentage"></span></p>
          <p><span id="remarks"></span></p>
        </div>

        <div class="next-button-container">
          <button onclick="closeScoreModal()">Selanjutnya</button>
        </div>

      </div>
    </div>

    <div class="game-quiz-container">

      <div class="game-details-container">
        <h1>Skor : <span id="player-score"> /10</span></h1>
        <h1>Pertanyaan : <span id="question-number"> /10</span></h1>
      </div>

      <div class="game-question-container">
        <h1 id="display-question"></h1>
      </div>

      <div class="game-options-container">

        <div class="score-modal-container" id="option-modal">

          <div class="modal-content-container">
            <h1>Mohon Pilih Salah Satu Jawaban !</h1>

            <div class="modal-button-container">
              <button onclick="closeOptionModal()">Baiklah</button>
            </div>

          </div>

        </div>

        <style>
          /* make radio bg is different when checked */
          .spanspan {
            background-color: darkgray;
          }
          .radioquiz:checked+.optionquiz {
            background-color: #2da6ff;
          }
        </style>
        <span class="spanspan">
          <input type="radio" id="option-one" name="option" class="radioquiz" value="optionA" />
          <label for="option-one" class="optionquiz" id="option-one-label"></label>
        </span>

        <span class="spanspan">
          <input type="radio" id="option-two" name="option" class="radioquiz" value="optionB" />
          <label for="option-two" class="optionquiz" id="option-two-label"></label>
        </span>

        <span class="spanspan">
          <input type="radio" id="option-three" name="option" class="radioquiz" value="optionC" />
          <label for="option-three" class="optionquiz" id="option-three-label"></label>
        </span>

        <span class="spanspan">
          <input type="radio" id="option-four" name="option" class="radioquiz" value="optionD" />
          <label for="option-four" class="optionquiz" id="option-four-label"></label>
        </span>

      </div>

      <div class="next-button-container">
        <button onclick="handleNextQuestion()">Pertanyaan Berikutnya</button>
      </div>
    </div>
  </main>
</body>

</html>
